name: CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '**.zig'
      - '**.org'
      - '.dir-locals.el'
      - 'Makefile'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
      - master
    paths:
      - '**.zig'
      - 'Makefile'
      - 'build.zig'
      - 'build.zig.zon'
      - '.github/workflows/ci.yml'

jobs:
  test:
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .
        if: matrix.os == 'ubuntu-latest'
      - run: make build
